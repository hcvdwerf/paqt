name: paqt
x-api: &api
  build:
    context: .
    dockerfile: infra/Dockerfile.dotnet
  image: paqt-wmo:local
  environment: &api-env
    ASPNETCORE_HTTP_PORTS: ""
    ASPNETCORE_URLS: https://+:8443
    ASPNETCORE_Kestrel__Certificates__Default__Path: /certs/api/server.crt
    ASPNETCORE_Kestrel__Certificates__Default__KeyPath: /certs/api/server.key
    SSL_CERT_FILE: /certs/ca.crt
    Swagger__Enabled: 'true'
    Database__Host: postgres
    Database__Name: wmo
    Database__User: wmo
    Database__PasswordFile: /secrets/wmo-password
  volumes:
    - ./.local/certs/ca.crt:/certs/ca.crt:ro
    - ./.local/certs/api:/certs/api:ro
    - ./.local/secrets/wmo-password:/secrets/wmo-password:ro
  networks: [backend]
services:
  init:
    image: paqt-bootstrap:local
    build:
      context: .
      dockerfile: infra/Dockerfile.init
    volumes:
      - ./.local:/local
    network_mode: none
  postgres:
    build:
      context: .
      dockerfile: infra/Dockerfile.postgres
    image: paqt-postgres:local
    entrypoint: [sh, /bootstrap/postgres-start.sh]
    environment:
      POSTGRES_PASSWORD_FILE: /secrets/postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./.local/secrets/postgres-password:/secrets/postgres-password:ro
      - ./.local/secrets/wmo-owner-password:/secrets/wmo-owner-password:ro
      - ./.local/secrets/wmo-password:/secrets/wmo-password:ro
      - ./.local/secrets/keycloak-password:/secrets/keycloak-password:ro
      - ./.local/certs/ca.crt:/certs/ca.crt:ro
      - ./.local/certs/postgres:/certs/postgres:ro
      - ./infra/postgres-start.sh:/bootstrap/postgres-start.sh:ro
      - ./infra/postgres-init.sh:/bootstrap/postgres-init.sh:ro
      - ./infra/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres']
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [backend]
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    entrypoint: [/bin/bash, -ec]
    command:
      - |
        export KC_DB_PASSWORD="$$(cat /secrets/keycloak-password)"
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /secrets/keycloak-admin-password)"
        exec /opt/keycloak/bin/kc.sh start --import-realm
    environment:
      KC_CACHE: local
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak?sslmode=verify-full&sslrootcert=/certs/ca.crt
      KC_DB_USERNAME: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_HOSTNAME: https://localhost:8444
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_HTTPS_CERTIFICATE_FILE: /certs/keycloak/server.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /certs/keycloak/server.key
      KC_HEALTH_ENABLED: 'true'
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_HTTP_ENABLED: 'false'
    ports: ['127.0.0.1:8444:8443']
    volumes:
      - ./.local/certs/ca.crt:/certs/ca.crt:ro
      - ./.local/certs/keycloak:/certs/keycloak:ro
      - ./.local/secrets/keycloak-password:/secrets/keycloak-password:ro
      - ./.local/secrets/keycloak-admin-password:/secrets/keycloak-admin-password:ro
      - ./.local/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, bash, -ec, 'exec 3<>/dev/tcp/localhost/9000; printf "GET /health/ready HTTP/1.0\r\n\r\n" >&3; grep -q "200 OK" <&3']
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks: [backend, edge]
  migrate:
    <<: *api
    command: [--migrate, --seed-demo]
    environment:
      <<: *api-env
      Database__User: wmo_owner
      Database__PasswordFile: /secrets/wmo-owner-password
    volumes:
      - ./.local/certs/ca.crt:/certs/ca.crt:ro
      - ./.local/certs/api:/certs/api:ro
      - ./.local/secrets/wmo-owner-password:/secrets/wmo-owner-password:ro
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *api
    depends_on:
      migrate: {condition: service_completed_successfully}
      keycloak: {condition: service_healthy}
    stop_grace_period: 30s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  kong:
    image: kong:3.9.4@sha256:8485cabdadb0320212baf1b3f3f47ab293438a61691d198154ccd899d5aabb65
    environment:
      KONG_NGINX_WORKER_PROCESSES: '1'
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /config/kong.json
      KONG_PROXY_LISTEN: '0.0.0.0:8443 ssl'
      KONG_ADMIN_LISTEN: 'off'
      KONG_STATUS_LISTEN: '0.0.0.0:8100'
      KONG_SSL_CERT: /certs/kong/server.crt
      KONG_SSL_CERT_KEY: /certs/kong/server.key
      KONG_PROXY_ACCESS_LOG: 'off'
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_LOG_LEVEL: warn
    ports: ['127.0.0.1:8443:8443']
    volumes:
      - ./.local/kong:/config:ro
      - ./.local/certs/kong:/certs/kong:ro
    depends_on: [api]
    healthcheck:
      test: [CMD, kong, health]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend, edge]
  unit-tests:
    profiles: [test]
    build:
      context: .
      dockerfile: infra/Dockerfile.tests
    image: paqt-dotnet-tests:local
    network_mode: none
    volumes: ['./artifacts:/artifacts']
  integration-tests:
    profiles: [test]
    image: paqt-dotnet-tests:local
    build:
      context: .
      dockerfile: infra/Dockerfile.tests
    command: [integration]
    environment:
      SSL_CERT_FILE: /certs/ca.crt
    volumes:
      - ./artifacts:/artifacts
      - ./.local/certs/ca.crt:/certs/ca.crt:ro
      - ./.local/secrets/wmo-owner-password:/secrets/wmo-owner-password:ro
      - ./.local/secrets/wmo-password:/secrets/wmo-password:ro
    depends_on:
      postgres: {condition: service_healthy}
    networks: [backend]
  playwright:
    image: paqt-playwright-tests:local
    profiles: [test]
    build:
      context: opdrachten/04-wmo/tests/Playwright
    environment:
      BASE_URL: https://kong:8443
      TOKEN_URL: https://keycloak:8443/realms/paqt/protocol/openid-connect/token
      NODE_EXTRA_CA_CERTS: /certs/ca.crt
    volumes:
      - ./artifacts/playwright:/tests/artifacts
      - ./.local/certs/ca.crt:/certs/ca.crt:ro
      - ./.local/client-secrets:/secrets:ro
    depends_on:
      kong: {condition: service_healthy}
    networks: [backend]
  architecture:
    command: [local]
    profiles: [architecture]
    image: structurizr/structurizr:2026.05.16@sha256:f2f00afe45c1981d557c5e1bd52fbcc8da0632d10a7c38038b6a1952db3e643b
    ports: ['127.0.0.1:8080:8080']
    volumes: ['./architecture:/usr/local/structurizr']
volumes:
  postgres-data:
networks:
  backend:
    internal: true
  edge:
    driver: bridge
